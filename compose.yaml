version: "3.8"

services:

  poller:
    image: poller:latest
    configs:
      - source: nas_config
        target: /app/config.json
    secrets:
      - nas_username
      - nas_password

  logger:
    image: logger:latest
    configs:
      - source: nas_config
        target: /app/config.json
    secrets:
      - nas_username
      - nas_password

  hmi_display:
    image: hmi_display:latest
    configs:
      - source: nas_config
        target: /app/config.json
    secrets:
      - nas_username
      - nas_password
    stdin_open: true
    tty: true

configs:
  nas_config:
    external: true

secrets:
  nas_username:
    external: true

  nas_password:
    external: true
